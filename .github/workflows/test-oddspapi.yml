name: Test OddsPapi WSL Pinnacle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-wsl-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Pinnacle WSL odds
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error

          API_KEY = os.environ.get("ODDSPAPI_API_KEY")
          if not API_KEY:
              raise SystemExit("Missing ODDSPAPI_API_KEY repository secret.")

          # WSL tournament ID was successfully discovered by the first test.
          WSL_TOURNAMENT_ID = "1044"
          BASE = "https://api.oddspapi.io/v4"

          def get_json(path, params, error_file):
              params = dict(params)
              params["apiKey"] = API_KEY
              url = BASE + path + "?" + urllib.parse.urlencode(params)

              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "wsl-stats-oddspapi-test/3.0",
                  },
              )

              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  with open(error_file, "w", encoding="utf-8") as f:
                      f.write(body)
                  print(f"OddsPapi returned HTTP {e.code}", file=sys.stderr)
                  print("Response body:", body[:3000], file=sys.stderr)
                  raise

          # IMPORTANT:
          # Use the minimal request shown in OddsPapi's own v4 overview docs.
          # That example uses the singular parameter `bookmaker=pinnacle`.
          # We deliberately make only ONE billable request.
          payload = get_json(
              "/odds-by-tournaments",
              {
                  "bookmaker": "pinnacle",
                  "tournamentIds": WSL_TOURNAMENT_ID,
              },
              "oddspapi_error.json",
          )

          with open("oddspapi_pinnacle_wsl.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)

          # Filter GW1 locally, without another API request.
          rows = payload if isinstance(payload, list) else []
          gw1 = []
          for fx in rows:
              date = str(fx.get("startTime", ""))[:10]
              if "2026-09-04" <= date <= "2026-09-07":
                  gw1.append(fx)

          with open("oddspapi_pinnacle_wsl_gw1.json", "w", encoding="utf-8") as f:
              json.dump(gw1, f, indent=2, ensure_ascii=False)

          print(f"Success. WSL fixtures returned: {len(rows)}")
          print(f"GW1 fixtures retained: {len(gw1)}")
          for fx in gw1:
              print(
                  fx.get("fixtureId"),
                  fx.get("startTime"),
                  "hasOdds=", fx.get("hasOdds")
              )
          PY

      - name: Upload OddsPapi results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddspapi-pinnacle-wsl-test
          path: |
            oddspapi_pinnacle_wsl.json
            oddspapi_pinnacle_wsl_gw1.json
            oddspapi_error.json
          if-no-files-found: warn
          retention-days: 7
