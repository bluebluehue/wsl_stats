name: Test OddsPapi WSL - One Request

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-wsl-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Check quota and fetch WSL odds
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error

          API_KEY = os.environ.get("ODDSPAPI_API_KEY")
          if not API_KEY:
              raise SystemExit("Missing ODDSPAPI_API_KEY repository secret.")

          BASE = "https://api.oddspapi.io/v4"
          WSL_TOURNAMENT_ID = 1044  # discovered successfully in the first test run

          def request_json(path, params=None, save_error_as=None):
              params = dict(params or {})
              params["apiKey"] = API_KEY
              url = BASE + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "wsl-stats-oddspapi-test/2.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  if save_error_as:
                      with open(save_error_as, "w", encoding="utf-8") as f:
                          f.write(body)
                  print(f"{path} returned HTTP {e.code}", file=sys.stderr)
                  print(body[:1000], file=sys.stderr)
                  raise

          # /account is unmetered and remains available even when the request
          # allowance has been exhausted.
          account = request_json("/account")
          with open("oddspapi_account.json", "w", encoding="utf-8") as f:
              json.dump(account, f, indent=2, ensure_ascii=False)

          print("ACCOUNT / QUOTA:")
          print(json.dumps(account, indent=2)[:4000])

          # We intentionally make exactly ONE billable request below.
          # odds-by-tournaments returns all fixtures + odds for the WSL in one call.
          #
          # We request both bookmakers in the same call. If a bookmaker does not
          # carry a fixture/market, it simply won't contribute data for that item.
          odds = request_json(
              "/odds-by-tournaments",
              {
                  "tournamentIds": str(WSL_TOURNAMENT_ID),
                  "bookmakers": "pinnacle,betpawa.cm",
                  "language": "en",
                  "verbosity": 3,
                  "oddsFormat": "decimal",
              },
              save_error_as="oddspapi_odds_error.json",
          )

          with open("oddspapi_wsl_all_odds.json", "w", encoding="utf-8") as f:
              json.dump(odds, f, indent=2, ensure_ascii=False)

          # Filter GW1 locally; this costs no additional API requests.
          def fixture_rows(payload):
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ("data", "fixtures", "results", "items"):
                      val = payload.get(key)
                      if isinstance(val, list):
                          return val
              return []

          rows = fixture_rows(odds)
          gw1 = []
          for fx in rows:
              start = str(fx.get("startTime", ""))
              if "2026-09-04" <= start[:10] <= "2026-09-07":
                  gw1.append(fx)

          with open("oddspapi_wsl_gw1_odds.json", "w", encoding="utf-8") as f:
              json.dump(gw1, f, indent=2, ensure_ascii=False)

          print(f"Total WSL fixtures in response: {len(rows)}")
          print(f"GW1 fixtures retained locally: {len(gw1)}")
          print("Success: only one billable OddsPapi request was used.")
          PY

      - name: Upload OddsPapi results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddspapi-wsl-one-request
          path: |
            oddspapi_account.json
            oddspapi_wsl_all_odds.json
            oddspapi_wsl_gw1_odds.json
            oddspapi_odds_error.json
          if-no-files-found: warn
          retention-days: 7
