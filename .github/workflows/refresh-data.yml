name: Refresh WSL Fantasy data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Refresh Pinnacle clean-sheet market data
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: python fetch_market_odds.py

      - name: Build data files
        run: python get_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transformed_data.json player_history.json fixtures.json teams.json gk_sanity_audit.json
          if [ -f market_odds.json ]; then git add market_odds.json; fi
          git diff --cached --quiet || git commit -m "Refresh WSL fantasy data"
          git push
