name: Audit involvement tackles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Audit Richards and Bronze tackle events
        run: python audit_tackles.py

      - name: Commit audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tackle_audit.json
          git diff --cached --quiet || git commit -m "Audit involvement tackle events"
          git push
