name: Audit official WSL involvement

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Syntax-check audit
        run: python -m py_compile audit_official_wsl_involvement.py

      - name: Run official WSL involvement audit
        run: python audit_official_wsl_involvement.py

      - name: Show audit summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("official_wsl_involvement_audit.json")
          if not path.exists():
              raise SystemExit("official_wsl_involvement_audit.json was not created")

          data = json.loads(path.read_text(encoding="utf-8"))
          meta = data.get("metadata", {})

          print("=== AUDIT SUMMARY ===")
          for key in [
              "history_match_count",
              "history_gameweeks",
              "unique_players_queried",
              "official_fetch_failures",
              "players_without_matchday_stats",
              "our_rows_with_no_wsl_player_id",
              "player_match_rows",
              "official_player_match_rows_matched",
              "exact_attacking_actions",
              "exact_defensive_actions",
              "exact_attacking_points",
              "exact_defensive_points",
              "exact_both_action_totals",
              "exact_both_point_totals",
              "rows_with_any_mismatch",
          ]:
              print(f"{key}: {meta.get(key)}")

          print("")
          print("Delta counts:")
          for category, counts in data.get("delta_counts", {}).items():
              print(f"{category}: {counts}")

          print("")
          print("First 25 mismatches:")
          for row in data.get("mismatches", [])[:25]:
              print(
                  f"- GW{row.get('fantasy_game_week')} | "
                  f"{row.get('fixture')} | {row.get('name')} | "
                  f"ATT official/ours "
                  f"{row.get('official_attacking_actions')}/"
                  f"{row.get('our_attacking_actions')} | "
                  f"DEF official/ours "
                  f"{row.get('official_defensive_actions')}/"
                  f"{row.get('our_defensive_actions')} | "
                  f"ATT pts official/ours "
                  f"{row.get('official_attacking_points')}/"
                  f"{row.get('our_attacking_points')} | "
                  f"DEF pts official/ours "
                  f"{row.get('official_defensive_points')}/"
                  f"{row.get('our_defensive_points')}"
              )
          PY

      - name: Commit audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add official_wsl_involvement_audit.json
          git add official_wsl_involvement_audit.csv

          if [ -d raw_wsl_official_player_stats ]; then
            git add raw_wsl_official_player_stats/
          fi

          git diff --cached --quiet || git commit -m "Audit official WSL involvement"
          git push
