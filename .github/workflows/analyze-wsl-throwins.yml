name: Analyze WSL throw-ins

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analyze cached Opta match data
        run: python analyze_wsl_throwins.py
      - name: Downloadable CSV reports
        uses: actions/upload-artifact@v4
        with:
          name: wsl-throwin-analysis
          path: throwin_analysis/*.csv
          if-no-files-found: error
