name: Analyze Bronze open-play role

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analyze WSL open-play Opta events (read-only)
        run: python analyze_bronze_tactics.py
      - name: Upload CSV reports, maps and methods
        uses: actions/upload-artifact@v4
        with:
          name: bronze-open-play-analysis
          path: bronze_tactical_analysis/*
          if-no-files-found: error
