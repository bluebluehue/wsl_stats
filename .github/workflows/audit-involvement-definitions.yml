name: Audit involvement definitions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Syntax-check audit
        run: python -m py_compile audit_involvement_definitions.py

      - name: Run involvement definition audit
        run: python audit_involvement_definitions.py

      - name: Validate audit output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("involvement_definition_audit.json")
          if not p.exists():
              raise SystemExit("Audit output file was not created")

          data = json.loads(p.read_text(encoding="utf-8"))
          m = data.get("metadata", {})

          if m.get("validation_players") != 18:
              raise SystemExit(f"Expected 18 validation players, got {m.get('validation_players')}")

          if not m.get("loaded_matches"):
              raise SystemExit("No Opta matches were loaded")

          if m.get("players_with_events", 0) == 0:
              raise SystemExit("No validation players matched any Opta events")

          print("Validation passed")
          print("Loaded matches:", len(m["loaded_matches"]))
          print("Players with events:", m["players_with_events"])
          print("Players with zero events:", m.get("players_with_zero_events", []))
          PY

      - name: Commit audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add involvement_definition_audit.json
          if [ -d raw_opta_events ]; then git add raw_opta_events/*.json 2>/dev/null || true; fi
          git diff --cached --quiet || git commit -m "Audit involvement definitions"
          git push
