name: Audit involvement definitions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Build current WSL data and raw feeds
        run: python get_data.py

      - name: Syntax-check audit
        run: python -m py_compile audit_involvement_definitions.py

      - name: Run involvement definition audit
        run: python audit_involvement_definitions.py

      - name: Validate audit output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("involvement_definition_audit.json")
          if not path.exists():
              raise SystemExit("Audit JSON was not created")

          data = json.loads(path.read_text(encoding="utf-8"))
          meta = data.get("metadata", {})

          expected = 37

          if meta.get("ground_truth_player_count") != expected:
              raise SystemExit(
                  f"Expected {expected} screenshot controls, got "
                  f"{meta.get('ground_truth_player_count')}"
              )

          if meta.get("players_audited") != expected:
              raise SystemExit(
                  f"Expected {expected} audited players, got "
                  f"{meta.get('players_audited')}"
              )

          if meta.get("players_with_zero_events"):
              raise SystemExit(
                  "Some screenshot controls had zero Opta events: "
                  + repr(meta["players_with_zero_events"])
              )

          if not meta.get("loaded_matches"):
              raise SystemExit("No Opta matches loaded")

          print("Audit validation passed")
          print("Loaded matches:", len(meta["loaded_matches"]))
          print("Current ATT exact:", meta.get("exact_current_att"))
          print("Revised ATT exact:", meta.get("exact_revised_att_hypothesis"))
          print("Current DEF exact:", meta.get("exact_current_def"))
          PY

      - name: Commit audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add involvement_definition_audit.json
          if [ -d raw_opta_events ]; then git add raw_opta_events/*.json 2>/dev/null || true; fi
          git diff --cached --quiet || git commit -m "Audit involvement definitions"
          git push
